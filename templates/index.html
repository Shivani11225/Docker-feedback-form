
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h2 { text-align: center; color: #1e293b; }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        textarea { resize: vertical; }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .success { color: green; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Jenkins automated-webhook Feedback Form</h2>

        {% if success %}
            <p class="success">Thank you! Your feedback was saved.</p>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label for="name">Name</label>
            <input id="name" type="text" name="name"
                   maxlength="100" required>

            <label for="email">Email</label>
            <input id="email" type="email" name="email"
                   maxlength="255" required>

            <label for="message">Your Feedback</label>
            <textarea id="message" name="message"
                      rows="4" maxlength="5000" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
